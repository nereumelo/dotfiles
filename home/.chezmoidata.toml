# Optional work profile (includeIf gitdir:~/work/). Leave enabled=false until filled in.
# Remotes stay git@github.com:org/repo.git. ssh_host is the SSH Host alias (ssh-manage);
# orgs are rewritten only for that path prefix (git@github.com:acme/ → Host github.com-acme).
[git.work]
enabled = false
name = ""
email = ""
ssh_host = ""
orgs = []

[themes.tokyo-night]
herdr = "tokyo-night"
nvim = "tokyonight"
nvim_style = "night"
bat = "tokyonight_night"
starship = "tokyo-night"
opencode = "tokyonight"

[themes.catppuccin]
herdr = "catppuccin"
